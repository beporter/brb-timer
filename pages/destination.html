<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <title>Twitch Authorization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <!--
    - This page's public URL must be listed as an allowed redirect URL in
      the Twitch Developer Console.
    - This page (quietly) accepts query params to override the default
      form inputs for `client_id` and `scopes`.
    -->
    <div class="card">
        <h2 class="card-header">Back from Twitch...</h2>
        <div class="card-body mt-3">
            <p id="status">Please wait.</p>
            <pre><code id="result"></code></pre>
        </div>
    </div>

    <footer class="text-secondary text-center mt-2">
        <em>Part of <a href="https://github.com/beporter/brb-timer">BRB Timer</a> by <a href="https://github.com/beporter">@beporter</a></em>
    </footer>

    <noscript>
        Javascript is not available. Please copy the &quot;access_token&quot; value from the URL in the address bar.
    </noscript>

    <script>
    (async function() {
        const status = document.getElementById('status');
        const result = document.getElementById('result')

        try {
            // Twitch implicit grant puts OAuth response in the URL #fragment...
            let params = Object.fromEntries(
                new URLSearchParams(
                    // But error responses are in the query string...
                    window.location.hash.substring(1) ?? window.location.search
                )
            );
            if (!params) {
                throw new Error('No OAuth response was received.');
            }

            const cookieState = await cookieStore.get('twitch_oauth_state');
            console.log(params, cookieState)
            if (!cookieState || params.state !== cookieState.value) {
                throw new Error('Returned OAuth state does not match stored cookie value.');
            }
            delete params.state;
            await cookieStore.delete('twitch_oauth_state');

            result.textContent = JSON.stringify(params, null, 2);
            status.textContent = 'Twitch authorization complete. Copy the access_token from below and paste it into OBS > Scripts > brb_timer.py > Twitch Access Token';

            // Remove the token from the browser's visible URL.
            if (window.location.hostname !== 'localhost') {
                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );
            }

        } catch (error) {
            console.error(error);
            status.textContent = `Authorization failed: ${error.message}`;
        }
    })();
    </script>
</body>
</html>
