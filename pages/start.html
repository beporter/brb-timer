<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <title>Twitch Authorization</title>
</head>
<body>
    <!--
    - This page's public URL must be listed as an allowed redirect URL in
      the Twitch Developer Console.
    - This page (quietly) accepts query params to override the default
      form inputs for `client_id` and `scopes`.
    -->
    <h2>Connect to Twitch</h2>
    <form id="oauth" method="GET" action="https://id.twitch.tv/oauth2/authorize">
        <input type="hidden" name="client_id" value="ja5swzyzsr1euwm0e53h1sxqhk553l">
        <input type="hidden" name="response_type" value="token">
        <input type="hidden" name="scope" value="chat:read chat:edit">

        <input type="hidden" name="redirect_uri" value="__auto_populated__">
        <input type="hidden" name="state" value="__auto_populated__">

        <button type="submit">Connect to Twitch</button>
    </form>
    <p id="status"></p>

    <script>
    (async function() {
        const generateRandomString = (length = 16) => {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            const randomValues = new Uint32Array(length);
            window.crypto.getRandomValues(randomValues);
            randomValues.forEach((value) => {
                result += characters.charAt(value % characters.length);
            });
            return result;
        }
        const inputs = document.querySelectorAll('input[type=hidden]');
        const status = document.getElementById('status');

        try {
            const params = new URLSearchParams(window.location.search);
            for (const i of inputs) {
                const key = i.name;
                if (params.has(key)) {
                    console.log(`Setting ${key} to ${params.get(key)}`)
                    i.value = params.get(key)
                    status.textContent = "Form inputs imported from query string.";
                } else if (key === 'redirect_uri') {
                    i.value = window.location.href.replace(
                        /start\.html(\?.*)?$/,
                        'destination.html',
                    );
                } else if (key === 'state') {
                    i.value = generateRandomString()
                    try {
                        await cookieStore.set({
                            name: 'twitch_oauth_state',
                            value: i.value,
                            expires: Date.now() + 60 * 10, // 10 mins
                        });
                    } catch (error) {
                        console.log(`Error setting cookie: ${error}`);
                    }
                }
            }
        } catch (error) {
            console.error(error);
            status.textContent = "Prep failed: " + error.message;
        }
    })();
    </script>
</body>
</html>
